name: Verify skills and workers
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv python install 3.13
      - run: python3 scripts/validate.py
      - run: uv run --python 3.13 --with duckdb==2.0.0 python -m unittest discover -s tests -v
      - run: uv run --python 3.13 --with duckdb==2.0.0 python skills/vgi-worker/scripts/verify_worker.py --project examples/python-double
      - run: npm ci
        working-directory: examples/typescript-double
      - run: uv run --python 3.13 --with duckdb==2.0.0 python skills/vgi-worker/scripts/verify_worker.py --project examples/typescript-double
      - run: npm ci && npm test && npm run typecheck && npm run test:sql
        working-directory: examples/agent-typescript-slugify
      - run: uv run --python 3.13 --with haybarn==2.0.0rc11 python skills/vgi-worker/scripts/verify_worker.py --engine haybarn --project examples/python-double
      - run: uv run --python 3.13 --with haybarn==2.0.0rc11 python skills/vgi-worker/scripts/verify_worker.py --engine haybarn --project examples/typescript-double
